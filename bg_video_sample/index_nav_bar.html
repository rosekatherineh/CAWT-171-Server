<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Video Background Demo and Navigation</title>
</head>


<style>

    body {
        font-family: arial, sans-serif;
        font-size: 100%;  /* initialize the font family size */
        margin: 0px; /* places everything at edges of screen  */
    }
    

    .main-section {
      position: relative; /* so that we can absolutely position the color overlay */
      width: 100%;   /* we want it to fill the width of the viewport */
      height: 100vh; /* makes it 100% height of the viewport */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
     .main-section nav {
      position: absolute; /* so that we can absolutely position it at the top of the relative parent */
      top: 0;
      left: 0;
      width: 100%; /* so it fills the width across the screen  */
      padding: 0 10px 0 10px;
      font-size: 1.25em;
      background-color: antiquewhite;  
      opacity: 0.8;
      display: flex;
     justify-content: space-between; /* places the two flex-items on opposite sides */
     z-index 1; /* make sure it is on outer most layer */

    }
    
    .main-section ul {
        list-style-type:none;
        display: flex;
    }
    
    .main-section li {
        width: 80px;
    }

    .main-section h1 {
      text-align: center;
      padding: 20px;
      margin: 15px;
      opacity: 0.7;
      font-size: 5em;
    }
    
    .main-section aside {
      text-align: center;
      padding: 20px;
      margin: 15px;
      opacity: 0.7;
      font-size: 2em;
    }

    
    video {
        min-width: 100%; /* so it fits in area */
        min-height: 100%;   
        position: absolute;  /* we want to place this over the main section */
        top: 0;  
        left: 0;          
        z-index: -2;  /* places video in back */
    }
    
   

    .color-overlay {
      position: absolute;
      top: 0;
      left: 0;
      background-color: aliceblue;
      width: 100%;   /* we want it to fill the width of the viewport */
      height: 100vh; /* makes it 100% height of the viewport */
      opacity: 0.5;
      z-index: -1;  /* places element in back but in front of vidoe */
    }
   
    
</style>




<body>

    <section class="main-section">
       
        <header>
           <h1>ROAD RACES</h1>
       </header>
       
        <nav>
           <p>Logo Here</p>
           <ul>
               <li>Home</li>
               <li>Page1</li>
               <li>Page2</li>
               <li>Page3</li>
           </ul>
        </nav>   
                  
       <aside>
           <p>If It Doesn't Challenge You, It Won't Change You!</p>
       </aside>

      <video autoplay loop muted>
        <source src="background_video.mp4" type="video/mp4">
      </video>
      
       <div class="color-overlay"></div>      

    </section>
    
    <section>
        <p>This is below the main section</p>
    </section>
    
   <!-- https://mediaboom.com - example    -->

</body>

</html>
