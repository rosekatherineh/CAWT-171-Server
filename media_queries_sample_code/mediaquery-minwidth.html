<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Media Query Test min-width</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- conditional comment to display html 5 elements correctly for IE < version 9 -->
    <!--[if lt IE 9]>
    <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <style>
        body {
            background-color: grey;
        }
        
        h1 {
            text-decoration: underline;
        }
        /* min width scales up so start with lowest brerakpoint 
           using a background color to text that we are in that width    
        */
        
        @media only screen and (min-width: 320px) {
            body {
                background-color: green;
            }
        }
        
        @media only screen and (min-width: 550px) {
            body {
                background-color: yellow;
            }
        }
        
        @media only screen and (min-width: 768px) {
            body {
                background-color: orange;
            }
        }
        
        @media only screen and (min-width: 960px) {
            body {
                background-color: red;
            }
        }

    </style>

</head>

<body>
    <div id="content">

        <h1>Media Queries using min-width which scales up<br> Resize the browser to see break points
        </h1>

        <p>
            default is gray
            <br> min-width: 960px is red
            <br> min-width: 768px is orange
            <br> min-width: 550px is yellow
            <br> min-width: 320px is green
            <br>


        </p>

    </div>


</body>

</html>
