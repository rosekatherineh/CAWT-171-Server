<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Media Query Test max-width</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- conditional comment to display html 5 elements correctly for IE < version 9 -->
    <!--[if lt IE 9]>
    <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

    <style>
        body {
            background-color: gray;
        }
        
        h1 {
            text-decoration: underline;
        }
        /* max width scales down so start with highest brerakpoint 
           using a background color to text that we are in that width    
        */
        
        @media only screen and (max-width: 960px) {
            body {
                background-color: red;
            }
        }
        
        @media only screen and (max-width: 768px) {
            body {
                background-color: orange;
            }
        }

    </style>

</head>

<body>
    <div id="content">

        <h1>Media Queries using max-width which scales down<br> Resize the browser to see break points
        </h1>

        <p>
            default is gray
            <br> max-width: 960px is red
            <br> max-width: 768px is orange
            <br> max-width: 550px is yellow
            <br> max-width: 320px is green
            <br>


        </p>

    </div>


</body>

</html>
